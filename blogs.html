<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blogs | Technical Write-ups</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-color: #00ff9d;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 900px; margin: auto; }

        
        .home-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--accent-color);
            padding: 5px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .home-link:hover {
            background: var(--accent-color);
            color: #000;
        }

        header { margin-bottom: 40px; }
        h1 { color: var(--accent-color); font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); }

        .blog-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            transition: 0.3s;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .blog-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-5px);
        }

        .blog-card h2 { color: var(--accent-color); margin-top: 0; }
        .blog-card p { color: var(--text-muted); margin-bottom: 10px; }
        .read-more { color: var(--accent-color); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    
    <a href="index.html" class="home-link">← Home</a>

    <header>
        <h1>Technical Blogs</h1>
        <p class="subtitle">Documentation of my cyber security and development journey</p>
    </header>

    
    <a href="Laravel_Security.html" class="blog-card">
        <h2>Laravel: Architecture & Security</h2>
        <p>A deep-dive into how Laravel uses MVC patterns and built-in security features to protect web applications.</p>
        <span class="read-more">Read Article →</span>
    </a>

    
    <a href="#" class="blog-card">
        <h2>Coming Soon: New Topic</h2>
        <p></p>
        <span class="read-more">Work in progress...</span>
    </a>
</div>

</body>
</html>
